name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run typecheck:web
      - run: npm run build:web
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - name: Fail if player data was committed
        run: |
          if git ls-files | grep -Ei '(\.season\.json|\.roster\.json|^data/(?!\.gitkeep))' ; then
            echo "Player data found in the repository. Remove it."; exit 1
          fi
          echo "No player data in the repository."
