<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>League Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--frost:#E6EDF3;--panel:#fff;--ink:#0F2233;--steel:#5D7488;--hair:#C9D6E1;
 --blue:#1B5FA8;--red:#C2352C;--board:#0C1A26;--amber:#FFB020;--green:#2E8B57}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--frost);color:var(--ink);
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
h1,h2,.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
 letter-spacing:.03em;margin:0}
h1{font-size:30px;font-weight:700;line-height:1}
h2{font-size:17px;font-weight:700;margin-bottom:2px}
.sub{font-size:12.5px;color:var(--steel);margin-top:6px;line-height:1.45}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:14px;margin-top:12px}
.hint{font-size:11.5px;color:var(--steel);margin:4px 0 10px;line-height:1.45}
label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
 color:var(--steel);margin-bottom:4px}
input,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#F7FAFC;
 border:1px solid var(--hair);border-radius:7px;padding:8px 9px;min-height:38px}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.field{margin-bottom:9px}
.tabs{display:flex;gap:5px;margin-top:12px;overflow-x:auto;padding-bottom:3px}
.tab{flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
 letter-spacing:.05em;font-size:15px;font-weight:700;padding:9px 14px;border-radius:8px;
 border:1px solid var(--hair);background:var(--panel);color:var(--steel);cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.board{background:var(--board);border-radius:10px;padding:16px 14px 14px;margin-top:12px;border:1px solid #24384a}
.brow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{text-align:center}
.num{font-family:'Roboto Mono',monospace;font-weight:700;font-size:26px;color:var(--amber);
 line-height:1;font-variant-numeric:tabular-nums}
.cap{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;
 font-size:9.5px;color:#7E96AA;margin-top:6px}
.verdict{margin-top:13px;padding-top:11px;border-top:1px solid #24384a;font-family:'Roboto Mono',monospace;
 font-size:12px;font-weight:700;text-align:center;line-height:1.6}
.ok{color:#3BC17E}.bad{color:#FF6B60}.mid{color:#7E96AA;font-weight:500}
.row{border:1px solid var(--hair);border-radius:9px;padding:10px;margin-bottom:8px;background:#F7FAFC}
.del{border:1px solid var(--hair);background:#fff;color:var(--red);border-radius:7px;width:38px;
 height:38px;font-size:18px;line-height:1;cursor:pointer;flex:0 0 auto}
.addbtn{width:100%;padding:11px;border-radius:8px;border:1px dashed var(--blue);background:#fff;
 color:var(--blue);font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
 letter-spacing:.06em;font-weight:700;font-size:14px;cursor:pointer;margin-top:2px}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--hair);background:#fff;color:var(--ink);
 font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;
 font-weight:700;font-size:14px;cursor:pointer}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--ink);color:#fff;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
 padding:7px 5px;text-align:left;font-weight:600}
td{padding:6px 5px;border-bottom:1px solid var(--hair)}
tr:last-child td{border-bottom:none}
.mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sc{width:46px;min-height:30px;padding:3px;font-size:14px;text-align:center}
.flag{color:var(--red);font-size:11px}
.pill{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 padding:2px 6px;border-radius:20px;background:var(--hair);color:var(--ink);white-space:nowrap}
.pill.in{background:var(--green);color:#fff}
.dh{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:16px;
 font-weight:700;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.note{font-size:11.5px;color:var(--steel);line-height:1.5;margin-top:9px}
.warn{background:#FDECEA;border:1px solid #F0B4AE;border-radius:8px;padding:10px;font-size:12px;
 color:#8A2018;margin-top:9px;line-height:1.5}
.good{background:#E8F5EE;border:1px solid #A9D9BF;border-radius:8px;padding:10px;font-size:12px;
 color:#1D6340;margin-top:9px;line-height:1.5}
.openrow td{background:#FFF8E6;color:#8A6A18}
.pill.open{background:var(--amber);color:#3A2A00}
.daybtns{display:flex;gap:4px;flex-wrap:wrap}
.dayb{flex:1 1 auto;min-width:40px;padding:7px 4px;border-radius:6px;border:1px solid var(--hair);
 background:#fff;color:var(--steel);font-size:11px;font-weight:600;cursor:pointer}
.dayb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.champ{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:22px;font-weight:700;
 color:var(--blue)}
@media print{.tabs,.board,.btnrow,.addbtn,.del{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body><div class="wrap" id="root"></div>
<script>
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SH=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KEY='league-scheduler-v2';
let uid=1; const nid=()=>'x'+(uid++)+Math.random().toString(36).slice(2,6);

const DEFAULT={
 name:'Adult League 2026-27', start:'2026-09-13', end:'2027-03-21', cap:8, pcap:0, playoffTeams:4, allowDouble:false,
 venue:'Montclair State University Ice Arena', city:'Little Falls',
 divisions:[{id:'d1',name:'Open',days:'',start:'',end:'',cap:'',pcap:''},
            {id:'d2',name:'35+',days:'Tuesday, Thursday',start:'',end:'',cap:'',pcap:''}],
 teams:[], lines:[], closures:[{id:'c1',from:'2026-11-26',to:'2026-11-29',note:'Thanksgiving'}],
 blackouts:[], extras:[], scores:{}, po:{}
};
for(let i=1;i<=8;i++)DEFAULT.teams.push({id:'t'+i,name:'Team '+i,div:'d1',days:'',pcap:''});
for(let i=9;i<=13;i++)DEFAULT.teams.push({id:'t'+i,name:'Team '+i,div:'d2',days:'',pcap:''});
[[0,'21:30'],[0,'23:00'],[1,'23:00'],[2,'23:00'],[3,'23:00'],[4,'23:00']]
 .forEach((x,i)=>DEFAULT.lines.push({id:'l'+i,day:x[0],time:x[1],mins:80,rink:'Rocky',use:'games',from:'',until:''}));

let S=JSON.parse(JSON.stringify(DEFAULT)), tab='setup', msg='', showWhat='all', showTeam='';

/* ---------------- dates ---------------- */
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>{if(!s)return'';const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2)};
const fmtT=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';
 h=h%12===0?12:h%12;return h+':'+String(m).padStart(2,'0')+ap};
const closed=s=>S.closures.some(c=>{const to=c.to&&c.to>=c.from?c.to:c.from;return c.from&&s>=c.from&&s<=to});
const weekOf=d=>{const x=pd(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dStart=d=>d.start&&d.start>S.start?d.start:S.start;
const dEnd=d=>d.end&&d.end<S.end?d.end:S.end;
const dCap=d=>Math.max(1,+(d.cap||S.cap)||1);
const dPcap=d=>d.pcap===''||d.pcap==null?(+S.pcap||0):Math.max(0,+d.pcap||0);
const tPcap=t=>{const d=S.divisions.find(x=>x.id===t.div);
 if(t.pcap!==''&&t.pcap!=null)return Math.max(0,+t.pcap||0);
 return d?dPcap(d):0;};
const dayOK=(d,dayName)=>!String(d.days||'').trim()||String(d.days).toLowerCase().includes(dayName.toLowerCase());
const tDayOK=(t,dayName)=>!t||!String(t.days||'').trim()||
 String(t.days).toLowerCase().includes(dayName.toLowerCase());
const tFree=(t,date)=>!t||!S.blackouts.some(b=>b.team===t.id&&b.date===date);
const canPlay=(id,date,dayName)=>{const t=S.teams.find(x=>x.id===id);
 return tDayOK(t,dayName)&&tFree(t,date)};
const tDays=t=>String(t.days||'').trim()?String(t.days).split(',').map(x=>x.trim()).filter(Boolean):DAYS.slice();
function tToggle(id,day){
 const t=S.teams.find(x=>x.id===id); if(!t)return;
 let cur=tDays(t);
 cur=cur.indexOf(day)>=0?cur.filter(d=>d!==day):cur.concat([day]);
 cur=DAYS.filter(d=>cur.indexOf(d)>=0);
 t.days=cur.length===7?'':cur.join(', ');
 save();render();
}

/* ---------------- ice expansion ---------------- */
function allSlots(){
 const out=[];
 S.lines.forEach(l=>{
  const st=l.from&&l.from>S.start?l.from:S.start;
  const en=l.until&&l.until<S.end?l.until:S.end;
  if(!st||!en||en<st)return;
  const d=pd(st); d.setDate(d.getDate()+((l.day-d.getDay()+7)%7));
  while(iso(d)<=en){const s=iso(d);
   if(!closed(s))out.push({date:s,day:l.day,time:l.time,mins:l.mins,rink:l.rink,use:l.use||'games',lineId:l.id});
   d.setDate(d.getDate()+7);}
 });
 S.extras.forEach(x=>{if(x.date&&!closed(x.date)&&x.date>=S.start&&x.date<=S.end)
  out.push({date:x.date,day:pd(x.date).getDay(),time:x.time,mins:x.mins,rink:x.rink,use:x.use||'games',lineId:'extra'})});
 out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:a.time>b.time?1:0));
 return out;
}

/* ---------------- round robin (same index maths as the workbook) ---------------- */
function candidates(teams,nRounds){
 const n=teams.length, pad=n%2?n+1:n, pairs=pad/2, out=[];
 for(let rd=1;rd<=nRounds;rd++){
  for(let pp=1;pp<=pairs;pp++){
   const idx=(pp-1+rd-1)%pairs;
   const h=idx===0?1:((rd-1+idx)%(pad-1))+2;
   const a=idx===0?((rd-1)%(pad-1))+2:(((rd-1-idx)%(pad-1)+(pad-1))%(pad-1))+2;
   const flip=rd%2===0;
   const hi=flip?a:h, ai=flip?h:a;
   const H=hi>n?null:teams[hi-1], A=ai>n?null:teams[ai-1];
   out.push([H,A]);
  }
 }
 return out;
}

/* ---------------- the whole build ---------------- */
function build(){
 const problems=[],slots=allSlots();
 const gameSlots=slots.filter(s=>s.use!=='practice');
 const pracSlots=slots.filter(s=>s.use==='practice');
 const dv=S.divisions.map(d=>{
  const teams=S.teams.filter(t=>t.div===d.id);
  const cap=dCap(d), pad=teams.length%2?teams.length+1:teams.length;
  const perRound=teams.length<2?0:(teams.length%2?pad/2-1:pad/2);
  const target=Math.floor(teams.length*cap/2);
  const po=Math.max(0,S.playoffTeams-1);
  const pneed=teams.reduce((n,t)=>n+tPcap(t),0);
  return {...d,teams,cap,perRound,target,po,weight:target+po,pneed};
 });
 dv.forEach(d=>{if(d.teams.length<2)problems.push(d.name+' has fewer than 2 teams')});

 function share(pool,wkey){
  const by={}; dv.forEach(d=>by[d.id]=[]);
  const daysWith=[...new Set(pool.map(s=>DAYS[s.day]))];
  const claim={};
  dv.forEach(d=>{
   const n=daysWith.filter(dn=>dayOK(d,dn)).length;
   claim[d.id]=n?Math.max(1,Math.round(d[wkey]*daysWith.length/n)):0;
  });
  const got={}; dv.forEach(d=>got[d.id]=0);
  pool.forEach(s=>{
   const dn=DAYS[s.day];
   const need=wkey==='pneed'?1:2;
   const elig=dv.filter(d=>d[wkey]>0&&claim[d.id]>0&&dayOK(d,dn)&&
    s.date>=dStart(d)&&s.date<=dEnd(d)&&d.teams.filter(t=>tDayOK(t,dn)).length>=need);
   if(!elig.length)return;
   let chosen=elig[0],best=Infinity;
   elig.forEach(d=>{const sc=(got[d.id]+1)/claim[d.id];
    if(sc<best-1e-12||(Math.abs(sc-best)<1e-12&&claim[d.id]>claim[chosen.id])){best=sc;chosen=d}});
   got[chosen.id]++; s.div=chosen.id; by[chosen.id].push(s);
  });
  return by;
 }
 // spread the unpopular ice times around
 const bucket=s=>{const h=+String(s.time||'12:00').slice(0,2);
  return h<10?'early':(h>=20?'late':'mid')};
 // share each time-of-day band out separately, so no division is handed
 // a disproportionate pile of 7am ice
 const bands={early:[],mid:[],late:[]};
 gameSlots.forEach(s=>bands[bucket(s)].push(s));
 const bydiv={}; dv.forEach(d=>bydiv[d.id]=[]);
 ['early','late','mid'].forEach(b=>{
  const part=share(bands[b],'weight');
  dv.forEach(d=>{bydiv[d.id]=bydiv[d.id].concat(part[d.id]||[])});
 });
 dv.forEach(d=>bydiv[d.id].sort((a,b2)=>a.date<b2.date?-1:a.date>b2.date?1:
  (a.time<b2.time?-1:a.time>b2.time?1:0)));

 // pairings, capped so nobody passes their division's ceiling
 const played={}; S.teams.forEach(t=>played[t.id]=0);
 const games=[];
 dv.forEach(d=>{
  if(d.teams.length<2||d.perRound<=0)return;
  let n=0;
  const cand=candidates(d.teams,Math.min(60,Math.ceil(d.target/d.perRound)+12));
  cand.forEach(([a,b])=>{
   if(!a||!b||n>=d.target)return;
   if(played[a.id]>=d.cap||played[b.id]>=d.cap)return;
   played[a.id]++;played[b.id]++;n++;
   games.push({divId:d.id,div:d.name,home:a.name,away:b.name,homeId:a.id,awayId:b.id,idx:n});
  });
  let guard=0;
  while(n<d.target&&guard++<800){
   const short=d.teams.filter(t=>played[t.id]<d.cap).sort((x,y)=>played[x.id]-played[y.id]);
   if(short.length<2)break;
   const[a,b]=short; played[a.id]++;played[b.id]++;n++;
   games.push({divId:d.id,div:d.name,home:a.name,away:b.name,homeId:a.id,awayId:b.id,idx:n,topup:true});
  }
  d.scheduled=n; d.slots=bydiv[d.id].length;
  d.short=Math.max(0,d.weight-d.slots);
  if(d.short)problems.push(d.name+' is short '+d.short+' game slot'+(d.short>1?'s':''));
 });

 // hold back the end of the season so every bracket has ice after the last game
 const poTotal=dv.reduce((n,d)=>n+(d.teams.length>=S.playoffTeams?d.po:0),0);
 const roundsNeeded=Math.max(1,Math.round(Math.log(S.playoffTeams)/Math.log(2)));
 const allWeeks=[...new Set(gameSlots.map(s=>weekOf(s.date)))].sort();
 const reserved=new Set();
 if(poTotal>0){
  let acc=0,take=0;
  while(take<allWeeks.length-1&&(take<roundsNeeded||acc<poTotal)){
   take++; const w=allWeeks[allWeeks.length-take];
   reserved.add(w); acc+=gameSlots.filter(s=>weekOf(s.date)===w).length;
  }
 }

 const tb={}; S.teams.forEach(t=>tb[t.id]={early:0,mid:0,late:0});

 const gDate={}, gWeek={};      // where each team already has a game
 const mark=(g,s)=>{
  g.date=s.date; g.day=s.day; g.time=s.time; g.rink=s.rink;
  const b=bucket(s);
  [g.homeId,g.awayId].forEach(t=>{
   (gDate[t]=gDate[t]||{})[s.date]=1;
   (gWeek[t]=gWeek[t]||{})[weekOf(s.date)]=1;
   if(tb[t])tb[t][b]++;
  });
 };

 // place games week by week, one per team per week, balancing slot times
 let doubles=0;
 dv.forEach(d=>{
  const pool=bydiv[d.id]||[]; if(!pool.length)return;
  let left=games.filter(g=>g.divId===d.id);
  const weeks={}; pool.forEach(s=>{const w=weekOf(s.date);
   if(!reserved.has(w))(weeks[w]=weeks[w]||[]).push(s)});
  const wk=Object.keys(weeks).sort();
  const maxWeek=Math.max(1,Math.floor(d.teams.length/2));
  const need=Math.ceil(left.length/maxWeek);
  if(need>wk.length)problems.push(d.name+' needs '+need+' weeks to give every team '+d.cap+
   ' games one per week, but only '+wk.length+' weeks have ice. '+
   (d.teams.length%2?'An odd number of teams means one sits out every week. ':'')+
   'Lengthen the season, cut the cap, or accept some double weeks.');
  const taken={};
  wk.forEach((w,wi)=>{
   if(!left.length)return;
   // fill the unpopular ice first, while every game is still a candidate
   const rank={early:0,late:1,mid:2};
   const avail=weeks[w].slice().sort((a,b)=>rank[bucket(a)]-rank[bucket(b)]);
   const quota=Math.min(maxWeek,avail.length,Math.ceil(left.length/(wk.length-wi)));
   const seen={}; let placed=0;
   for(const s of avail){
    if(placed>=quota||!left.length)break;
    const dn=DAYS[s.day], b=bucket(s);
    let pick=-1,bestLoad=Infinity;
    left.forEach((g,i)=>{
     if(seen[g.homeId]||seen[g.awayId])return;
     if(!canPlay(g.homeId,s.date,dn)||!canPlay(g.awayId,s.date,dn))return;
     if(!S.allowDouble&&((gDate[g.homeId]||{})[s.date]||(gDate[g.awayId]||{})[s.date]))return;
     const h=tb[g.homeId]?tb[g.homeId][b]:0, a2=tb[g.awayId]?tb[g.awayId][b]:0;
     const load=Math.max(h,a2)*10+h+a2;      // whoever is worst off goes first
     if(load<bestLoad){bestLoad=load;pick=i}
    });
    if(pick<0)continue;
    const g=left.splice(pick,1)[0];
    seen[g.homeId]=seen[g.awayId]=1;
    mark(g,s); taken[s.date+'|'+s.time+'|'+(s.rink||'')]=1; placed++;
   }
  });
  // leftovers double up, on a different day wherever possible
  if(left.length){
   const dnum=x=>Math.round(pd(x).getTime()/86400000);
   const free=pool.filter(s=>!taken[s.date+'|'+s.time+'|'+(s.rink||'')]&&!reserved.has(weekOf(s.date)));
   left.slice().forEach(g=>{
    let best=-1,bestTier=9,bestGap=-1;
    free.forEach((s,i)=>{
     if(!s)return;
     const dnm=DAYS[s.day];
     if(!canPlay(g.homeId,s.date,dnm)||!canPlay(g.awayId,s.date,dnm))return;
     const hs=gDate[g.homeId]||{}, as=gDate[g.awayId]||{};
     const same=hs[s.date]||as[s.date];
     if(same&&!S.allowDouble)return;
     let gap=99;
     Object.keys(hs).concat(Object.keys(as)).forEach(dt=>{
      gap=Math.min(gap,Math.abs(dnum(s.date)-dnum(dt)))});
     const tier=same?3:(gap>=2?1:2);
     if(tier<bestTier||(tier===bestTier&&gap>bestGap)){bestTier=tier;bestGap=gap;best=i}
    });
    if(best<0)return;
    const s=free[best]; free[best]=null;
    mark(g,s); taken[s.date+'|'+s.time+'|'+(s.rink||'')]=1;
    left.splice(left.indexOf(g),1); doubles++;
   });
  }
  d.taken=taken; d.leftover=left;
 });

 // practices: never on a day that team already has a game, one a week where possible
 const practices=[]; const pdone={}; S.teams.forEach(t=>pdone[t.id]=0);
 const owned={}; dv.forEach(d=>owned[d.id]=[]); const sharedPrac=[];
 pracSlots.forEach(s=>{
  const line=S.lines.find(l=>l.id===s.lineId)||{};
  s.cap=Math.max(1,Math.min(4,+(line.slotTeams||1)));
  s.only=String(line.only||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const pd2=line.pdiv||'';
  if(pd2&&dv.some(d=>d.id===pd2)){s.div=pd2;owned[pd2].push(s)} else sharedPrac.push(s);
 });
 const byprac=share(sharedPrac,'pneed');
 const pTaken={}, pWeek={}, pDate={};
 dv.forEach(d=>{
  const pool=(owned[d.id]||[]).concat(byprac[d.id]||[])
   .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
  d.pslots=pool.reduce((n,s)=>n+s.cap,0);
  d.pshort=Math.max(0,d.pneed-d.pslots);
  if(d.pshort)problems.push(d.name+' is short '+d.pshort+' practice place'+(d.pshort>1?'s':''));
  if(!d.pneed||!pool.length)return;
  const want={}; d.teams.forEach(t=>want[t.id]=tPcap(t));
  let remaining=d.pneed;
  pool.forEach((s,i)=>{
   if(remaining<=0)return;
   const w=weekOf(s.date);
   const place=Math.min(s.cap,Math.max(1,Math.ceil(remaining/(pool.length-i))));
   const on=[]; let used=0;
   for(let k=0;k<place;k++){
    const ok=t=>want[t.id]>0&&on.indexOf(t.id)<0&&tDayOK(t,DAYS[s.day])&&tFree(t,s.date)&&
     !(gDate[t.id]||{})[s.date]&&(!s.only.length||s.only.indexOf(t.name.toLowerCase())>=0);
    let cands=d.teams.filter(t=>ok(t)&&!(pWeek[t.id]||{})[w]);
    if(!cands.length)cands=d.teams.filter(ok);
    if(!cands.length)break;
    cands.sort((x,y)=>(want[y.id]-want[x.id])||(pdone[x.id]-pdone[y.id]));
    const t=cands[0];
    want[t.id]--; remaining--; on.push(t.id); pdone[t.id]++; used++;
    (pWeek[t.id]=pWeek[t.id]||{})[w]=1;
    (pDate[t.id]=pDate[t.id]||{})[s.date]=1;
    practices.push({id:'pr'+d.id+'_'+i+'_'+k,divId:d.id,div:d.name,teamId:t.id,team:t.name,
     slotKey:s.date+'|'+s.time+'|'+(s.rink||''),
     date:s.date,day:s.day,time:s.time,rink:s.rink});
   }
   if(used)pTaken[s.date+'|'+s.time+'|'+(s.rink||'')]=1;
  });
 });

 // anything still unplaced tries every spare slot in the league, not just its own
 // division's share. Game ice first, then practice ice as a genuine last resort.
 let onPractice=0;
 const gTaken={}; games.forEach(g=>{if(g.date)gTaken[g.date+'|'+g.time+'|'+(g.rink||'')]=1});
 function rescue(pool,isPractice){
  dv.forEach(d=>{
   const left=d.leftover||[]; if(!left.length)return;
   const spare=pool.filter(s=>!gTaken[s.date+'|'+s.time+'|'+(s.rink||'')]&&
    !(isPractice&&pTaken[s.date+'|'+s.time+'|'+(s.rink||'')])&&
    !reserved.has(weekOf(s.date))&&s.date>=dStart(d)&&s.date<=dEnd(d)&&dayOK(d,DAYS[s.day]))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
   left.slice().forEach(g=>{
    const i=spare.findIndex(s=>s&&canPlay(g.homeId,s.date,DAYS[s.day])&&canPlay(g.awayId,s.date,DAYS[s.day])&&
     !(pDate[g.homeId]||{})[s.date]&&!(pDate[g.awayId]||{})[s.date]&&
     (S.allowDouble||(!(gDate[g.homeId]||{})[s.date]&&!(gDate[g.awayId]||{})[s.date])));
    if(i<0)return;
    const s=spare[i]; spare[i]=null;
    mark(g,s); gTaken[s.date+'|'+s.time+'|'+(s.rink||'')]=1;
    if(isPractice){g.onPractice=1; onPractice++; pTaken[s.date+'|'+s.time+'|'+(s.rink||'')]=1}
    left.splice(left.indexOf(g),1);
   });
  });
 }
 rescue(gameSlots,false);
 rescue(pracSlots,true);
 dv.forEach(d=>{(d.leftover||[]).forEach(g=>g.unplaced=1)});

 // playoffs only after the whole regular season
 const seasonEndsOn=games.filter(g=>g.date).map(g=>g.date).sort().pop()||'';
 dv.forEach(d=>{
  const pool=bydiv[d.id]||[], taken=d.taken||{};
  d.lastGame=games.filter(g=>g.divId===d.id&&g.date).map(g=>g.date).sort().pop()||'';
  d.free=pool.filter(s=>!taken[s.date+'|'+s.time+'|'+(s.rink||'')]&&s.date>seasonEndsOn)
   .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
 });

 practices.forEach(p=>{
  const c=[],t=S.teams.find(x=>x.id===p.teamId);
  if(!p.date)c.push('no ice available');
  else if(t){const dn=DAYS[p.day];
   if(!tDayOK(t,dn))c.push(t.name+' does not play '+dn+'s');
   if(S.blackouts.some(b=>b.team===t.id&&b.date===p.date))c.push(t.name+' blacked out');
   if((gDate[t.id]||{})[p.date])c.push(t.name+' also has a game that day');}
  p.conflicts=c;
 });
 practices.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));

 games.forEach(g=>{
  g.id='g'+g.divId+'_'+g.idx;
  const c=[];
  if(!g.date)c.push(g.unplaced?'no legal slot left':'no ice available');
  else{const dn=DAYS[g.day];
   [g.homeId,g.awayId].forEach(tid=>{const t=S.teams.find(x=>x.id===tid); if(!t)return;
    if(!tDayOK(t,dn))c.push(t.name+' does not play '+dn+'s');
    if(S.blackouts.some(b=>b.team===tid&&b.date===g.date))c.push(t.name+' blacked out');
    if((pDate[tid]||{})[g.date])c.push(t.name+' also practises that day');});}
  g.conflicts=c;
 });
 games.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:
  ((a.time||'')<(b.time||'')?-1:1));

 const wkc={}; games.forEach(g=>{if(!g.date)return;const w=weekOf(g.date);
  [g.homeId,g.awayId].forEach(t=>{const k=t+'|'+w; wkc[k]=(wkc[k]||0)+1})});
 const multi=Object.values(wkc).filter(v=>v>1).length;
 const dd={}; games.forEach(g=>{if(!g.date)return;
  [g.homeId,g.awayId].forEach(t=>{const k=t+'|'+g.date; dd[k]=(dd[k]||0)+1})});
 const sameDay=Object.values(dd).filter(v=>v>1).length;
 const clash=games.filter(g=>g.date&&((pDate[g.homeId]||{})[g.date]||(pDate[g.awayId]||{})[g.date])).length;
 const usedKey={};
 games.forEach(g=>{if(g.date)usedKey[g.date+'|'+g.time+'|'+(g.rink||'')]=1});
 practices.forEach(p=>{if(p.date)usedKey[p.date+'|'+p.time+'|'+(p.rink||'')]=1});
 Object.values(window._poSlots||{}).forEach(k=>usedKey[k]=1);
 const open=slots.filter(s=>!usedKey[s.date+'|'+s.time+'|'+(s.rink||'')])
  .map(s=>({...s,divName:(dv.find(d=>d.id===s.div)||{}).name||''}));
 const cnt=S.teams.map(t=>played[t.id]);
 const pcnt=S.teams.filter(t=>tPcap(t)>0).map(t=>pdone[t.id]);
 return {games,practices,open,problems,slots,gameSlots,pracSlots,dv,bydiv,byprac,played,pdone,
  multi,sameDay,doubles,onPractice,clash,tb,
  pover:S.teams.filter(t=>pdone[t.id]>tPcap(t)).length,
  plo:pcnt.length?Math.min(...pcnt):0, phi:pcnt.length?Math.max(...pcnt):0,
  over:S.teams.filter(t=>{const d=dv.find(x=>x.id===t.div);return d&&played[t.id]>d.cap}).length,
  lo:cnt.length?Math.min(...cnt):0, hi:cnt.length?Math.max(...cnt):0};
}

function standings(games){
 const out={};
 S.divisions.forEach(d=>{
  const rows=S.teams.filter(t=>t.div===d.id).map(t=>({id:t.id,name:t.name,gp:0,w:0,l:0,t:0,gf:0,ga:0}));
  const by={}; rows.forEach(r=>by[r.id]=r);
  games.filter(g=>g.divId===d.id).forEach(g=>{
   const s=S.scores[g.id]; if(!s||s.h===''||s.a===''||s.h==null||s.a==null)return;
   const h=+s.h,a=+s.a,H=by[g.homeId],A=by[g.awayId]; if(!H||!A)return;
   H.gp++;A.gp++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
   if(h>a){H.w++;A.l++}else if(a>h){A.w++;H.l++}else{H.t++;A.t++}
  });
  rows.forEach(r=>{r.pts=r.w*2+r.t;r.diff=r.gf-r.ga});
  rows.sort((x,y)=>y.pts-x.pts||y.diff-x.diff||y.gf-x.gf);
  rows.forEach((r,i)=>r.seed=i+1);
  out[d.id]=rows;
 });
 return out;
}
function bracket(d,rows,pool){
 const P=S.playoffTeams,g=[];
 if(rows.length<P)return g;
 let at=0,roundEnd='',roundNo=0;
 for(let i=1;i<=P-1;i++){
  const rn=i<=P/2?1:(i<=P/2+P/4?2:3);
  if(rn!==roundNo){                       // a round cannot start until the last one ends
   roundNo=rn;
   while(at<pool.length&&roundEnd&&pool[at].date<=roundEnd)at++;
  }
  const s=pool[at]; if(s){at++; if(!roundEnd||s.date>roundEnd)roundEnd=s.date}
  let home,away;
  if(i<=P/2){home=rows[i-1]?rows[i-1].name:'Seed '+i; away=rows[P-i]?rows[P-i].name:'Seed '+(P+1-i)}
  else{const f1=2*(i-P/2)-1,f2=2*(i-P/2);
   home=pwin(d.id,f1)||'Winner G'+f1; away=pwin(d.id,f2)||'Winner G'+f2}
  const lab=i<=P/2?(P===2?'Final':P===4?'Semifinal':'Quarterfinal'):(i<=P/2+P/4?(P/4===1?'Final':'Semifinal'):'Final');
  g.push({id:'p'+d.id+'_'+i,n:i,divId:d.id,label:lab,home,away,
   date:s?s.date:null,time:s?s.time:null,rink:s?s.rink:null});
 }
 return g;
}
function pwin(divId,n){
 const s=S.po['p'+divId+'_'+n]; if(!s||s.h===''||s.a===''||s.h==null)return null;
 const b=(window._po||{})[divId]; if(!b)return null;
 const gm=b.find(x=>x.n===n); if(!gm)return null;
 return +s.h>+s.a?gm.home:+s.a>+s.h?gm.away:null;
}

function schedTab(R){
 const rows=[];
 if(showWhat!=='practices'&&showWhat!=='open')R.games.forEach(g=>rows.push({t:'Game',...g}));
 if(showWhat==='open'||showWhat==='all'){
  (R.open||[]).forEach(s=>rows.push({t:'Open',id:'o'+s.date+s.time,div:s.divName||'',
   date:s.date,day:s.day,time:s.time,rink:s.rink,home:'—',away:'',conflicts:[],
   openUse:s.use==='practice'?'practice ice':'game ice'}));
 }
 if(showWhat!=='games'&&showWhat!=='open'){
  const grp={};
  R.practices.forEach(p=>{(grp[p.slotKey]=grp[p.slotKey]||[]).push(p)});
  Object.values(grp).forEach(g=>{const f=g[0];
   rows.push({t:'Practice',id:f.id,div:f.div,date:f.date,day:f.day,time:f.time,rink:f.rink,
    home:g.map(x=>x.team).join(' / '),away:'',ids:g.map(x=>x.teamId),
    conflicts:[...new Set(g.flatMap(x=>x.conflicts||[]))]})});
 }
 rows.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:
  ((a.time||'')<(b.time||'')?-1:1));
 if(showTeam&&!S.teams.some(t=>t.id===showTeam))showTeam='';
 const mine=r=>!showTeam||(r.t==='Open'?false:r.t==='Game'
   ?(r.homeId===showTeam||r.awayId===showTeam):(r.ids||[]).indexOf(showTeam)>=0);
 const shown=rows.filter(mine);
 const who=S.teams.find(t=>t.id===showTeam);
 let h='<div class="card"><h2>Schedule</h2><p class="hint">Enter scores as games are played. '+
  'Red lines need a manual move.</p><div class="btnrow" style="margin:0 0 10px">'+
  [['all','Everything'],['games','Games only'],['practices','Practices only'],['open','Open ice']]
   .map(([k,l])=>'<button class="btn'+(showWhat===k?' dark':'')+'" onclick="showWhat=\''+k+'\';render()">'+l+'</button>').join('')+
  '</div><div class="field" style="max-width:280px"><label>Team</label>'+
  '<select onchange="showTeam=this.value;render()"><option value="">All teams</option>'+
  S.divisions.map(d=>'<optgroup label="'+esc(d.name)+'">'+
   S.teams.filter(t=>t.div===d.id).map(t=>'<option value="'+t.id+'"'+(showTeam===t.id?' selected':'')+
    '>'+esc(t.name)+'</option>').join('')+'</optgroup>').join('')+'</select></div>'+
  (who?'<div class="good">'+esc(who.name)+': '+shown.filter(r=>r.t==='Game').length+' games, '+
   shown.filter(r=>r.t==='Practice').length+' practices'+
   (shown.some(r=>r.conflicts&&r.conflicts.length)?' &middot; some entries are flagged below':'')+
   '</div>':'')+
  '<div class="scroll"><table>'+
  '<tr><th>Date</th><th>Time</th><th>Rink</th><th>Type</th><th>Div</th><th>Home</th><th>Away</th><th></th><th></th></tr>';
 shown.forEach(g=>{const sc=S.scores[g.id]||{h:'',a:''};
  h+='<tr'+(g.t==='Open'?' class="openrow"':'')+'><td class="mono">'+(g.date?fmt(g.date):'—')+
   '</td><td class="mono">'+(g.time?fmtT(g.time):'—')+
   '</td><td>'+esc(g.rink||'')+'</td><td><span class="pill'+
   (g.t==='Game'?' in':g.t==='Open'?' open':'')+'">'+(g.t==='Open'?'Open '+(g.openUse||''):g.t)+
   '</span>'+(g.onPractice?' <span class="pill open">on practice ice</span>':'')+'</td>'+
   '<td>'+esc(g.div)+'</td><td>'+esc(g.home)+'</td><td>'+esc(g.away)+'</td>'+
   (g.t==='Game'
     ?'<td><input class="sc" inputmode="numeric" value="'+(sc.h??'')+'" onchange="scset(\''+g.id+'\',\'h\',this.value)"></td>'+
      '<td><input class="sc" inputmode="numeric" value="'+(sc.a??'')+'" onchange="scset(\''+g.id+'\',\'a\',this.value)"></td>'
     :'<td></td><td></td>')+'</tr>';
  if(g.conflicts&&g.conflicts.length)
   h+='<tr><td colspan="9" class="flag">&#9888; '+g.conflicts.map(esc).join(' &middot; ')+'</td></tr>';
 });
 h+='</table></div><div class="btnrow"><button class="btn" onclick="exportCSV()">Download '+(showTeam||showWhat!=='all'?'this view':'CSV')+
  '</button><button class="btn" onclick="window.print()">Print</button>'+
  (showTeam?'<button class="btn" onclick="showTeam=\'\';render()">Clear team filter</button>':'')+
  '</div></div>';
 return h;
}

function standTab(st,R){
 let h='';
 S.divisions.forEach(d=>{
  const rows=st[d.id]||[];
  h+='<div class="card"><h2>'+esc(d.name)+'</h2><div class="scroll"><table>'+
   '<tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>Diff</th>'+
   '<th>Sched</th><th>Prac</th><th>Early</th><th>Late</th><th></th></tr>';
  rows.forEach(r=>{const tm=S.teams.find(x=>x.id===r.id);
   const gsch=R.games.filter(g=>g.homeId===r.id||g.awayId===r.id).length;
   const pr=R.practices.filter(p=>p.teamId===r.id).length, want=tm?tPcap(tm):0;
   h+='<tr><td class="mono">'+r.seed+'</td><td>'+esc(r.name)+'</td><td class="mono">'+r.gp+
   '</td><td class="mono">'+r.w+'</td><td class="mono">'+r.l+'</td><td class="mono">'+r.t+
   '</td><td class="mono"><b>'+r.pts+'</b></td><td class="mono">'+(r.diff>0?'+':'')+r.diff+
   '</td><td class="mono">'+gsch+'</td><td class="mono'+(want&&pr<want?' flag':'')+'">'+pr+
   (want?'/'+want:'')+'</td><td class="mono">'+((R.tb[r.id]||{}).early||0)+
   '</td><td class="mono">'+((R.tb[r.id]||{}).late||0)+'</td><td>'+
   (r.seed<=S.playoffTeams?'<span class="pill in">in</span>':'')+'</td></tr>'});
  h+='</table></div></div>';
 });
 return h;
}

function poTab(){
 let h='';
 S.divisions.forEach(d=>{
  const b=window._po[d.id]||[];
  h+='<div class="card"><h2>'+esc(d.name)+' bracket</h2>';
  if(!b.length){h+='<p class="hint">Needs at least '+S.playoffTeams+' teams.</p></div>';return}
  h+='<div class="scroll"><table><tr><th>Game</th><th>Round</th><th>Date</th><th>Home</th><th>Away</th><th></th><th></th></tr>';
  b.forEach(g=>{const s=S.po[g.id]||{h:'',a:''};
   h+='<tr><td class="mono">G'+g.n+'</td><td>'+g.label+'</td><td class="mono">'+
    (g.date?fmt(g.date)+' '+fmtT(g.time):'—')+'</td><td>'+esc(g.home)+'</td><td>'+esc(g.away)+'</td>'+
    '<td><input class="sc" inputmode="numeric" value="'+(s.h??'')+'" onchange="poset(\''+g.id+'\',\'h\',this.value)"></td>'+
    '<td><input class="sc" inputmode="numeric" value="'+(s.a??'')+'" onchange="poset(\''+g.id+'\',\'a\',this.value)"></td></tr>';
  });
  h+='</table></div><p class="note">Champion</p><div class="champ">'+
   (pwin(d.id,S.playoffTeams-1)?esc(pwin(d.id,S.playoffTeams-1)):'not decided yet')+'</div></div>';
 });
 h+='<div class="note">Divisions never meet, so each crowns its own champion.</div>';
 return h;
}

 return '<div class="card"><h2>Share and back up</h2>'+
  '<p class="hint">Your league is saved in this browser only. Nobody else sees your data, and clearing '+
  'browser storage will erase it. Use the buttons below to move a league between people or machines.</p>'+
  '<div class="btnrow">'+
  '<button class="btn dark" onclick="exportJSON()">Download league file</button>'+
  '<button class="btn" onclick="document.getElementById(\'imp\').click()">Load league file</button>'+
  '<button class="btn" onclick="exportCSV()">Download schedule CSV</button>'+
  '<button class="btn dark" onclick="exportSportNinja()">SportNinja upload CSV</button>'+
  '<button class="btn" onclick="reset()">Reset</button></div>'+
  '<input id="imp" type="file" accept=".json" style="display:none" onchange="importJSON(event)">'+
  '<p class="note"><b>SportNinja.</b> The upload file carries games only, never practices, with the '+
  'rink on each ice line going into the Facility column and the venue and city coming from Setup. '+
  'Regular season and decided playoff games are included. Anything unscheduled, or a bracket game whose '+
  'teams are not settled yet, is left out and counted for you.</p>'+
  '<p class="note"><b>Working with coworkers.</b> Send them the link to this page plus your downloaded '+
  'league file. They open the link, click Load league file, and see exactly what you see. When they make '+

  'live copy at a time.</p>'+
  '<p class="note"><b>Other rinks.</b> Send them the link on its own. They start from the default setup '+

}

/* ---------------- mutations ---------------- */
const set=(k,v)=>{S[k]=v;save();render()};
const dset=(i,k,v)=>{S.divisions.find(d=>d.id===i)[k]=v;save();render()};
const dadd=()=>{S.divisions.push({id:nid(),name:'Division '+(S.divisions.length+1),days:'',start:'',end:'',cap:''});save();render()};
const ddel=i=>{if(S.divisions.length<2)return;S.divisions=S.divisions.filter(d=>d.id!==i);
 S.teams=S.teams.filter(t=>t.div!==i);save();render()};
const tadd=d=>{S.teams.push({id:nid(),name:'New team',div:d,days:'',pcap:''});save();render()};
const tset=(i,k,v)=>{S.teams.find(t=>t.id===i)[k]=v;save();render()};
const tdel=i=>{S.teams=S.teams.filter(t=>t.id!==i);S.blackouts=S.blackouts.filter(b=>b.team!==i);save();render()};
const ladd=()=>{S.lines.push({id:nid(),day:0,time:'21:00',mins:80,rink:'',use:'games',pdiv:'',slotTeams:1,only:'',from:'',until:''});save();render()};
const lset=(i,k,v)=>{S.lines.find(l=>l.id===i)[k]=v;save();render()};
const ldel=i=>{S.lines=S.lines.filter(l=>l.id!==i);save();render()};
const xadd=()=>{S.extras.push({id:nid(),date:S.start,time:'20:00',mins:80,rink:'',use:'games'});save();render()};
const xset=(i,k,v)=>{S.extras.find(x=>x.id===i)[k]=v;save();render()};
const xdel=i=>{S.extras=S.extras.filter(x=>x.id!==i);save();render()};
const cadd=()=>{S.closures.push({id:nid(),from:S.start,to:'',note:''});save();render()};
const cset=(i,k,v)=>{S.closures.find(c=>c.id===i)[k]=v;save();render()};
const cdel=i=>{S.closures=S.closures.filter(c=>c.id!==i);save();render()};
const badd=()=>{S.blackouts.push({id:nid(),team:S.teams[0]?S.teams[0].id:'',date:S.start});save();render()};
const bset=(i,k,v)=>{S.blackouts.find(b=>b.id===i)[k]=v;save();render()};
const bdel=i=>{S.blackouts=S.blackouts.filter(b=>b.id!==i);save();render()};
const scset=(g,k,v)=>{S.scores[g]=S.scores[g]||{h:'',a:''};S.scores[g][k]=v;save();render()};
const poset=(g,k,v)=>{S.po[g]=S.po[g]||{h:'',a:''};S.po[g][k]=v;save();render()};

load(); render();
</script>
